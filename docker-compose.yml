version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: upgrowplan_monitoring_db
    environment:
      POSTGRES_DB: monitoring
      POSTGRES_USER: monitoring_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-monitoring_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monitoring_user -d monitoring"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - monitoring_network

  # Redis
  redis:
    image: redis:7-alpine
    container_name: upgrowplan_monitoring_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - monitoring_network

  # Backend FastAPI
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: upgrowplan_monitoring_backend
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://monitoring_user:${POSTGRES_PASSWORD:-monitoring_password}@postgres:5432/monitoring
      REDIS_URL: redis://redis:6379/0
      VERCEL_TOKEN: ${VERCEL_TOKEN}
      VERCEL_PROJECT_ID: ${VERCEL_PROJECT_ID}
      HEROKU_API_KEY: ${HEROKU_API_KEY}
      HEROKU_APP_NAMES: ${HEROKU_APP_NAMES}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    volumes:
      - ./backend:/app
    networks:
      - monitoring_network
    restart: unless-stopped

  # Celery Worker
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: upgrowplan_monitoring_celery_worker
    command: celery -A monitoring.tasks worker --loglevel=info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://monitoring_user:${POSTGRES_PASSWORD:-monitoring_password}@postgres:5432/monitoring
      REDIS_URL: redis://redis:6379/0
      VERCEL_TOKEN: ${VERCEL_TOKEN}
      VERCEL_PROJECT_ID: ${VERCEL_PROJECT_ID}
      HEROKU_API_KEY: ${HEROKU_API_KEY}
      HEROKU_APP_NAMES: ${HEROKU_APP_NAMES}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
    volumes:
      - ./backend:/app
    networks:
      - monitoring_network
    restart: unless-stopped

  # Celery Beat (Scheduler)
  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: upgrowplan_monitoring_celery_beat
    command: celery -A monitoring.tasks beat --loglevel=info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://monitoring_user:${POSTGRES_PASSWORD:-monitoring_password}@postgres:5432/monitoring
      REDIS_URL: redis://redis:6379/0
      VERCEL_TOKEN: ${VERCEL_TOKEN}
      VERCEL_PROJECT_ID: ${VERCEL_PROJECT_ID}
      HEROKU_API_KEY: ${HEROKU_API_KEY}
      HEROKU_APP_NAMES: ${HEROKU_APP_NAMES}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    volumes:
      - ./backend:/app
    networks:
      - monitoring_network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  monitoring_network:
    driver: bridge
